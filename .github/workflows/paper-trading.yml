
name: TradeBot AI - Worker Setup Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install worker dependencies
        run: npm install --no-save --ignore-scripts pg dotenv

      - name: Verify worker dependencies
        run: node --input-type=module -e "import('pg').then(() => console.log('PostgreSQL package ready'))"

      - name: Run worker safety smoke test
        env:
          PAPER_ONLY: 'true'
          WORKER_SMOKE_TEST: 'true'
          BOT_ENABLED: 'false'
          RUN_ONCE: 'true'
        run: node worker/index.js

      
      - name: Test BTC market analysis
        env:
          PAPER_ONLY: 'true'
          BOT_ENABLED: 'false'
        run: node worker/market-analysis.js

        
      - name: Test paper trading engine
        env:
          PAPER_ONLY: 'true'
          BOT_ENABLED: 'false'
        run: node worker/paper-engine.js


      - name: Test Supabase database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAPER_ONLY: 'true'
          BOT_ENABLED: 'false'
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import fs from 'node:fs';

          if (!process.env.DATABASE_URL) {
            throw new Error('DATABASE_URL secret is missing');
          }

          const pool = new pg.Pool({
            connectionString: process.env.DATABASE_URL,
            connectionTimeoutMillis: 10000,
            ssl: {
              ca: fs.readFileSync('prod-ca-2021.crt', 'utf8'),
              rejectUnauthorized: true
            }
          });

          try {
            const result = await pool.query(`
              SELECT
                current_database() AS database_name,
                EXISTS (
                  SELECT 1
                  FROM information_schema.tables
                  WHERE table_schema = 'public'
                    AND table_name = 'bot_settings'
                ) AS schema_ready
            `);

            if (!result.rows[0].schema_ready) {
              throw new Error('Trading schema not found');
            }

            console.log(
              'Supabase connection successful. Trading schema found. No trades executed.'
            );
          } finally {
            await pool.end();
          }
          NODE
